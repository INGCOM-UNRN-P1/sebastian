[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sebastian"
version = "0.1.0"
description = "Analizador de llamadas recursivas, consumo de stack frame y riesgos de stack overflow en C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
sebastian = "sebastian.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sebastian"]

[tool.pytest.ini_options]
pythonpath = ["src"]
